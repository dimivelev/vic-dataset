# Free Render setup: one free web service (scraper + downloads) and one free Postgres.
# Database credentials and the download key are generated by Render, never stored here.
databases:
  - name: vic-db
    plan: free
    region: frankfurt
    databaseName: vic
    user: vic

services:
  - type: web
    name: vic-scraper
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-render.txt
    startCommand: python render_app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: vic-db
          property: connectionString
      - key: DOWNLOAD_KEY
        generateValue: true
      - key: SCRAPE_DELAY
        value: "1.5"
      - key: SITES
        value: fun_dir_bg,vicove_com,zaigravka_bg,vicove_biz
